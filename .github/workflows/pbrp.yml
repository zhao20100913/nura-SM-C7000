name: Build PBRP (c7lte)

on:
  workflow_dispatch:
    inputs:
      pbrp_branch:
        description: "PBRP manifest branch"
        default: android-12.1
        required: false
  push:
    paths:
      - 'pbrp/**'
      - '.github/workflows/pbrp.yml'

concurrency:
  group: pbrp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DEVICE: c7lte
      BRANCH: ${{ inputs.pbrp_branch || 'android-12.1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32z1-dev libelf-dev liblz4-tool \
            libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3
          sudo rm -f /usr/bin/python && sudo ln -s /usr/bin/python3 /usr/bin/python

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git identity
        run: |
          git config --global user.name "c7 builder"
          git config --global user.email "c7@users.noreply.github.com"
          git config --global color.ui false

      - name: Repo init
        run: |
          mkdir -p ~/pbrp && cd ~/pbrp
          repo init --depth=1 -u https://github.com/PitchBlackRecoveryProject/manifest_pb.git -b "$BRANCH"

      - name: Repo sync
        run: |
          cd ~/pbrp
          # No -c: soong needs every project listed in the manifest, otherwise
          # modules such as neuralnetworks_utils_defaults are "undefined".
          for i in 1 2 3; do
            repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags && break
            echo "repo sync attempt $i failed, retrying in $((i * 30))s"
            sleep $((i * 30))
          done

      - name: Copy device tree
        run: |
          mkdir -p ~/pbrp/device/samsung
          cp -a "$GITHUB_WORKSPACE/pbrp/device/samsung/c7lte" ~/pbrp/device/samsung/c7lte

      - name: Inspect the tree (bring-up diagnostics)
        if: always()
        run: |
          cd ~/pbrp
          echo "== neuralnetworks dirs =="
          find hardware/interfaces/neuralnetworks -maxdepth 2 -type d 2>/dev/null | head -30
          echo "== Android.bp mentioning neuralnetworks_utils_defaults =="
          grep -rl "neuralnetworks_utils_defaults" --include=Android.bp . 2>/dev/null | head -20
          echo "== does 1.0/default exist? =="
          ls hardware/interfaces/neuralnetworks/1.0 2>/dev/null
          echo "== definitions of neuralnetworks_utils_defaults =="
          grep -rn "name: \"neuralnetworks_utils_defaults\"" --include=Android.bp . 2>/dev/null | head
          echo "== utils/common contents =="
          ls -l hardware/interfaces/neuralnetworks/utils/common 2>/dev/null
          grep -n "neuralnetworks_utils_defaults" hardware/interfaces/neuralnetworks/utils/common/Android.bp 2>/dev/null | head
      - name: Disable the NNAPI utility modules (PBRP manifest gap)
        run: |
          cd ~/pbrp
          # The manifest does not ship the project that defines the
          # "neuralnetworks_utils_defaults" defaults module, so soong stops
          # even though recovery never uses NNAPI. Park those blueprints.
          for f in $(grep -rl "neuralnetworks_utils_defaults" --include=Android.bp hardware/ 2>/dev/null); do
            echo "parking $f"
            mv "$f" "$f.disabled"
          done
      - name: Keep only English + Simplified Chinese UI strings
        run: |
          cd ~/pbrp
          # twres/languages is ~1.4 MB of XML; the recovery partition is
          # 32 MiB and the image was 154 KiB over.  Prune every locale we
          # do not need (keeps English and 简体中文).
          find bootable -path '*languages/*.xml' ! -name 'en.xml' ! -name 'zh_CN.xml' -print -delete | wc -l
      - name: Build recovery image
        run: |
          cd ~/pbrp
          export ALLOW_MISSING_DEPENDENCIES=true
          # Android 12.1 packaging: rsync copies out/.../root into
          # out/.../recovery, and a stale, non-empty recovery/root/vendor
          # directory blocks the vendor -> /system/vendor symlink.  Wrap rsync
          # so that directory is dropped at exactly the right moment.
          mkdir -p ~/bin
          cat > ~/bin/rsync <<'RSYNC'
          #!/bin/bash
          last="${!#}"
          if [[ "$last" == */recovery ]]; then
            rm -rf "$last/root/vendor"
          fi
          exec /usr/bin/rsync "$@"
          RSYNC
          sed -i 's/^ *//' ~/bin/rsync
          chmod +x ~/bin/rsync
          export PATH="$HOME/bin:$PATH"
          source build/envsetup.sh
          lunch pbrp_${DEVICE}-eng
          # First pass builds everything; on 12.1 the recovery ramdisk step can
          # trip over a stale "root/vendor" directory vs. the vendor symlink.
          # Removing it and re-running the (now incremental) build fixes that.
          make -j$(nproc --all) recoveryimage || {
            echo "== first pass failed, clearing recovery/root/vendor and retrying =="
            rm -rf "out/target/product/${DEVICE}/recovery/root/vendor"
            make -j$(nproc --all) recoveryimage
          }

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          OUT=~/pbrp/out/target/product/${DEVICE}
          cp "$OUT"/recovery.img "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          cp "$OUT"/recovery.img.md5 "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          ls -l "$GITHUB_WORKSPACE/out" || true
          sha256sum "$GITHUB_WORKSPACE"/out/* > "$GITHUB_WORKSPACE/out/SHA256SUMS" 2>/dev/null || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbrp-c7lte-${{ github.run_number }}
          path: out/
          retention-days: 15
