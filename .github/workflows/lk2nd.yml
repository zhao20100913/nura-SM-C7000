name: Build lk2nd (SM-C7000)

# Builds the lk2nd secondary bootloader for the Samsung Galaxy C7 with the
# C7 device tree from lk2nd/msm8953-samsung-c7lte.dts.
#
# Flash the resulting lk2nd.img to the BOOT partition once (Heimdall), then
# all later boot images can be flashed with `fastboot flash boot boot.img`
# from lk2nd itself (it writes the real boot image at a 512 KiB offset).

on:
  workflow_dispatch:
    inputs:
      lk2nd_ref:
        description: "lk2nd branch/tag/commit (msm8916-mainline/lk2nd)"
        required: false
        default: main
  push:
    branches: [main]
    paths:
      - "lk2nd/**"
      - ".github/workflows/lk2nd.yml"

permissions:
  contents: read

concurrency:
  group: lk2nd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Upstream lk2nd CI does the same: only dtc comes from apt, the ARM
      # toolchain is fetched as a release tarball.  apt mirrors on the
      # runners fail with DNS errors from time to time, so the dtc install
      # is bounded by timeouts and retried instead of hammering the network.
      - name: Install dtc
        run: |
          set -eux
          # The Ubuntu mirrors on the hosted runners keep failing to resolve
          # (azure.archive.ubuntu.com); take the two noble debs from the
          # kernel.org mirror instead and only fall back to apt at the end.
          BASE=https://mirrors.edge.kernel.org/ubuntu/pool/main/d/device-tree-compiler
          VER=1.7.0-2build1        # device-tree-compiler as shipped in Ubuntu 24.04
          ok=
          for i in 1 2 3; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
              -o /tmp/libfdt1.deb "$BASE/libfdt1_${VER}_amd64.deb" || true
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
              -o /tmp/dtc.deb "$BASE/device-tree-compiler_${VER}_amd64.deb" || true
            if [ -s /tmp/libfdt1.deb ] && [ -s /tmp/dtc.deb ] && \
               sudo dpkg -i /tmp/libfdt1.deb /tmp/dtc.deb; then
              ok=1; break
            fi
            echo "dtc download attempt $i failed, retrying"
            sleep $((i * 15))
          done
          if [ -z "$ok" ]; then
            echo "deb download failed, falling back to apt"
            timeout 240 sudo apt-get install -yqq device-tree-compiler
          fi
          dtc --version

      - name: Install ARM cross compiler
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '15.3.Rel1'

      - name: Check toolchain
        run: arm-none-eabi-gcc --version | head -1

      - name: Fetch lk2nd
        env:
          LK2ND_REF: ${{ github.event.inputs.lk2nd_ref || 'main' }}
        run: |
          set -eux
          rm -rf lk2nd-src
          # fetch + checkout, not clone --branch: the ref may be a bare
          # commit sha (e.g. the commit a known-good local build came from).
          git init -q lk2nd-src
          git -C lk2nd-src remote add origin \
            https://github.com/msm8916-mainline/lk2nd.git
          # A branch or tag fetches by name; a (short) commit sha does not, so
          # resolve it through the public GitHub API and fetch the full sha.
          if ! git -C lk2nd-src fetch --depth=1 origin "$LK2ND_REF" 2>/dev/null; then
            FULL=$(curl -fsSL "https://api.github.com/repos/msm8916-mainline/lk2nd/commits/$LK2ND_REF" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["sha"])')
            echo "resolved $LK2ND_REF -> $FULL"
            git -C lk2nd-src fetch --depth=1 origin "$FULL"
          fi
          git -C lk2nd-src checkout -q FETCH_HEAD
          git -C lk2nd-src log -1 --oneline

      - name: Add the C7 device tree
        run: |
          set -eux
          cp lk2nd/msm8953-samsung-c7lte.dts \
             lk2nd-src/lk2nd/device/dts/msm8953/msm8953-samsung-c7lte.dts

          # Register the dtb in the msm8953 platform rules (both the normal
          # dtb list and the QCDT list, so the Samsung ABL can select it).
          python3 - <<'PY'
          path = "lk2nd-src/lk2nd/device/dts/msm8953/rules.mk"
          src = open(path).read()
          entry = "\t$(LOCAL_DIR)/msm8953-samsung-c7lte.dtb \\\n"
          for var in ("ADTBS", "QCDTBS"):
              needle = var + " += \\\n"
              assert needle in src, f"{var} block not found"
              src = src.replace(needle, needle + entry, 1)
          open(path, "w").write(src)
          assert "msm8953-samsung-c7lte" in src
          PY

          grep -n "c7lte" lk2nd-src/lk2nd/device/dts/msm8953/rules.mk

      - name: Build lk2nd
        run: |
          set -eux
          cd lk2nd-src
          make -j"$(nproc)" TOOLCHAIN_PREFIX=arm-none-eabi- lk2nd-msm8953

          ls -l build-lk2nd-msm8953/lk2nd.img
          DTB=$(find build-lk2nd-msm8953 -name msm8953-samsung-c7lte.dtb -print -quit)
          test -n "$DTB"
          dtc -I dtb -O dts "$DTB" > /tmp/c7.dts
          grep -E "model =|match-bootloader|msm-id|board-id" /tmp/c7.dts

      - name: Check image size
        run: |
          set -eux
          SIZE=$(stat -c%s lk2nd-src/build-lk2nd-msm8953/lk2nd.img)
          echo "lk2nd.img is $((SIZE / 1024)) KiB"
          # lk2nd has to fit in front of the real boot image (512 KiB offset).
          test "$SIZE" -le $((512 * 1024))

      - name: Collect artifacts
        run: |
          set -eux
          mkdir -p out
          cp lk2nd-src/build-lk2nd-msm8953/lk2nd.img out/
          DTB=$(find lk2nd-src/build-lk2nd-msm8953 -name msm8953-samsung-c7lte.dtb -print -quit)
          dtc -I dtb -O dts "$DTB" > out/msm8953-samsung-c7lte.dts.decompiled
          ( cd out && sha256sum lk2nd.img msm8953-samsung-c7lte.dts.decompiled > SHA256SUMS )

      - name: Upload lk2nd.img
        uses: actions/upload-artifact@v4
        with:
          name: lk2nd-c7-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: error
