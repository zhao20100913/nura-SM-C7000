name: Build a boot.img variant with init tweaks

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "artifact id that contains boot.img"
        required: true
      mode:
        description: "probe | nolog"
        required: false
        default: "nolog"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Repack boot.img
        env:
          GH_TOKEN: ${{ github.token }}
          AID: ${{ inputs.artifact_id }}
          MODE: ${{ inputs.mode }}
        run: |
          set -eu
          gh api "/repos/${{ github.repository }}/actions/artifacts/$AID/zip" > a.zip
          mkdir -p art && unzip -o -q a.zip -d art
          python3 -m pip install --quiet zstandard
          MODE=$MODE python3 - <<'PY'
          import hashlib, io, os, pathlib, struct
          import zstandard

          mode = os.environ["MODE"]
          data = next(pathlib.Path("art").rglob("boot.img")).read_bytes()
          u32 = lambda o: struct.unpack_from("<I", data, o)[0]
          page, ksz, rsz = u32(36), u32(8), u32(16)
          align = lambda n: (n + page - 1) // page * page
          koff = align(1632)
          roff = koff + align(ksz)
          soff = roff + align(rsz)
          tail = data[soff:]
          rd = data[roff:soff][:rsz]
          if rd[:4].hex() == "28b52ffd":
              rd = zstandard.ZstdDecompressor().stream_reader(io.BytesIO(rd)).read()

          pos, entries = 0, []
          while pos + 110 <= len(rd):
              hdr = rd[pos:pos+110]
              assert hdr[:6] == b"070701", hdr[:6]
              f = [int(hdr[6+8*i:14+8*i], 16) for i in range(13)]
              name = rd[pos+110:pos+110+f[11]-1].decode()
              body = (pos + 110 + f[11] + 3) & ~3
              entries.append([f, name, rd[body:body+f[6]]])
              pos = (body + f[6] + 3) & ~3
              if name == "TRAILER!!!":
                  break
          print("entries", len(entries))

          probe = (b"/bin/busybox mkdir -p /dev /proc\n"
                   b"/bin/busybox mount -t devtmpfs dev /dev 2>/dev/null\n"
                   b"exec >/dev/kmsg 2>&1\n"
                   b"set -x\n"
                   b"echo PROBE-START\n")
          for e in entries:
              if e[1] == "init":
                  if probe not in e[2]:
                      e[2] = e[2].replace(b"#!/bin/busybox ash\n",
                                          b"#!/bin/busybox ash\n" + probe, 1)
                  assert probe in e[2]
                  if mode == "nolog":
                      assert b"\nsetup_log\n" in e[2]
                      e[2] = e[2].replace(b"\nsetup_log\n",
                                          b"\necho SKIP-SETUP-LOG >/dev/kmsg\n", 1)
                      print("setup_log call replaced")

          out = b""
          for f, name, body in entries:
              f = list(f); f[6] = len(body)
              nb = name.encode() + b"\0"; f[11] = len(nb)
              out += b"070701" + b"".join(b"%08X" % v for v in f) + nb
              out += b"\0" * ((4 - len(out) % 4) % 4)
              out += body + b"\0" * ((4 - len(body) % 4) % 4)
          new_rd = zstandard.ZstdCompressor(level=10).compress(out)
          hdr = bytearray(data[:1632])
          struct.pack_into("<I", hdr, 16, len(new_rd))
          img = (bytes(hdr) + b"\0" * (align(1632) - 1632)
                 + data[koff:koff + ksz] + b"\0" * (align(ksz) - ksz)
                 + new_rd + b"\0" * (align(len(new_rd)) - len(new_rd))
                 + tail)
          pathlib.Path("out").mkdir(exist_ok=True)
          name = "boot-%s.img" % mode
          pathlib.Path("out", name).write_bytes(img)
          print(name, len(img), hashlib.sha256(img).hexdigest())
          print("SEANDROIDENFORCE in tail:", b"SEANDROIDENFORCE" in tail)
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ inputs.mode }}-${{ github.run_id }}
          path: out/
