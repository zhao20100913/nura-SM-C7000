name: Inspect a boot image

# Quick, read-only job: downloads an existing artifact and dumps what is
# actually inside its boot.img (initramfs file list, /init shebang, busybox
# applets).  No kernel build, runs in about a minute.
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "artifact id (or leave empty for the newest)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download artifact
        env:
          GH_TOKEN: ${{ github.token }}
          AID: ${{ inputs.artifact_id }}
        run: |
          set -eux
          if [ -z "$AID" ]; then
            AID=$(gh api "/repos/${{ github.repository }}/actions/artifacts" \
                  --jq '.artifacts[0].id')
          fi
          echo "artifact $AID"
          gh api "/repos/${{ github.repository }}/actions/artifacts/$AID/zip" > a.zip
          unzip -o a.zip -d art
          ls -l art

      - name: Inspect boot.img
        run: |
          python3 - <<'PY'
          import gzip, pathlib, struct

          p = next(pathlib.Path("art").rglob("boot.img"))
          data = p.read_bytes()
          u32 = lambda off: struct.unpack_from("<I", data, off)[0]
          assert data[:8] == b"ANDROID!", data[:8]
          kernel_size, ramdisk_size, second_size = u32(8), u32(16), u32(24)
          page = u32(36); hdrver = u32(40)
          cmdline = data[64:576].split(b"\0")[0].decode()
          dt_size = u32(1632) if len(data) > 1632 else 0
          print("page", page, "hdrver", hdrver, "kernel", kernel_size,
                "ramdisk", ramdisk_size, "second", second_size, "dt", dt_size)
          print("cmdline:", cmdline)
          align = lambda n: (n + page - 1) // page * page
          off = page + align(kernel_size)
          rd = data[off:off + ramdisk_size]
          if rd[:2] == b"\x1f\x8b":
              rd = gzip.decompress(rd)
          print("ramdisk bytes", len(rd))

          pos = 0; entries = {}
          while pos + 110 <= len(rd):
              hdr = rd[pos:pos+110]
              if hdr[:6] not in (b"070701", b"070702"):
                  print("bad cpio magic at", pos, hdr[:6]); break
              f = lambda i: int(hdr[6+8*i:14+8*i], 16)
              namesize, filesize = f(11), f(6)
              name = rd[pos+110:pos+110+namesize-1].decode("utf-8", "replace")
              pos = (pos + 110 + namesize + 3) & ~3
              body = pos
              pos = (pos + filesize + 3) & ~3
              entries[name] = filesize
              if name == "TRAILER!!!":
                  break
              if name in ("/init", "/bin/sh", "/init_2nd.sh"):
                  print("---", name, filesize)
                  print(rd[body:body+min(filesize, 500)].decode("utf-8", "replace")[:500])
          print("entries", len(entries))
          for k in ("/init", "/init_2nd.sh", "/bin/busybox", "/bin/busybox-extras",
                    "/bin/sh", "/sbin/init", "/bin/mount", "/usr/bin/tee", "/usr/bin/logger"):
              print(f"{k:26} {'yes' if k in entries else 'MISSING'} {entries.get(k, '')}")
          PY
