name: Inspect a boot image

# Read-only helper: downloads an existing CI artifact, dumps what is really
# inside boot.img, and produces boot-debug.img whose initramfs /init mirrors
# all of its output into /dev/kmsg (so the log survives in ramoops).
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "artifact id (empty = newest)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download artifact
        env:
          GH_TOKEN: ${{ github.token }}
          AID: ${{ inputs.artifact_id }}
        run: |
          set -eu
          if [ -z "$AID" ]; then
            AID=$(gh api "/repos/${{ github.repository }}/actions/artifacts" --jq '.artifacts[0].id')
          fi
          echo "artifact $AID"
          gh api "/repos/${{ github.repository }}/actions/artifacts/$AID/zip" > a.zip
          unzip -o a.zip -d art
          ls -l art

      - name: Inspect boot.img
        run: |
          python3 -m pip install --quiet zstandard
          python3 - <<'PY'
          import gzip, io, pathlib, struct

          import zstandard

          p = next(pathlib.Path("art").rglob("boot.img"))
          data = p.read_bytes()
          u32 = lambda off: struct.unpack_from("<I", data, off)[0]
          assert data[:8] == b"ANDROID!", data[:8]
          kernel_size, ramdisk_size, second_size = u32(8), u32(16), u32(24)
          page = u32(36)
          print("page", page, "kernel", kernel_size, "ramdisk", ramdisk_size,
                "second", second_size)
          print("cmdline:", data[64:576].split(b"\0")[0].decode())

          align = lambda n: (n + page - 1) // page * page
          roff = align(1632) + align(kernel_size)
          rd = data[roff:roff + ramdisk_size]
          magic = rd[:4].hex()
          if rd[:2] == b"\x1f\x8b":
              rd = gzip.decompress(rd)
          elif magic == "28b52ffd":
              rd = zstandard.ZstdDecompressor().stream_reader(io.BytesIO(rd)).read()
          print("ramdisk magic", magic, "->", len(rd), "bytes")

          pos, entries = 0, []
          while pos + 110 <= len(rd):
              hdr = rd[pos:pos+110]
              assert hdr[:6] == b"070701", hdr[:6]
              f = [int(hdr[6+8*i:14+8*i], 16) for i in range(13)]
              name = rd[pos+110:pos+110+f[11]-1].decode("utf-8", "replace")
              body = (pos + 110 + f[11] + 3) & ~3
              entries.append((f, name, rd[body:body+f[6]]))
              pos = (body + f[6] + 3) & ~3
              if name == "TRAILER!!!":
                  break
          print("entries", len(entries))
          norm = {n.lstrip("./"): len(d) for _, n, d in entries}
          for k in ("init", "init_2nd.sh", "init_functions.sh", "usr/bin/busybox",
                    "usr/bin/busybox-extras", "usr/share/misc/source_deviceinfo"):
              print(f"{k:34} {'yes' if k in norm else 'MISSING'} {norm.get(k, '')}")
          PY

      - name: Build boot-debug.img (init logs to /dev/kmsg)
        run: |
          python3 - <<'PY'
          import gzip, hashlib, io, pathlib, struct

          import zstandard

          p = next(pathlib.Path("art").rglob("boot.img"))
          data = p.read_bytes()
          u32 = lambda off: struct.unpack_from("<I", data, off)[0]
          page, ksz, rsz = u32(36), u32(8), u32(16)
          align = lambda n: (n + page - 1) // page * page

          koff = align(1632)
          roff = koff + align(ksz)
          soff = roff + align(rsz)
          tail = data[soff:]                      # QCDT / dt area + SEANDROIDENFORCE
          rd = data[roff:roff + rsz]
          if rd[:4].hex() == "28b52ffd":
              rd = zstandard.ZstdDecompressor().stream_reader(io.BytesIO(rd)).read()
          else:
              rd = gzip.decompress(rd)

          pos, entries = 0, []
          while pos + 110 <= len(rd):
              hdr = rd[pos:pos+110]
              assert hdr[:6] == b"070701"
              f = [int(hdr[6+8*i:14+8*i], 16) for i in range(13)]
              name = rd[pos+110:pos+110+f[11]-1].decode("utf-8", "replace")
              body = (pos + 110 + f[11] + 3) & ~3
              entries.append([f, name, rd[body:body+f[6]]])
              pos = (body + f[6] + 3) & ~3
              if name == "TRAILER!!!":
                  break

          probe = b"exec >/dev/kmsg 2>&1\n"
          for e in entries:
              if e[1] == "init":
                  if probe not in e[2]:
                      e[2] = e[2].replace(b"#!/bin/busybox ash\n",
                                          b"#!/bin/busybox ash\n" + probe, 1)
                  assert probe in e[2]

          out = b""
          for f, name, body in entries:
              f = list(f); f[6] = len(body)
              nb = name.encode() + b"\0"; f[11] = len(nb)
              out += b"070701" + b"".join(b"%08X" % v for v in f) + nb
              out += b"\0" * ((4 - len(out) % 4) % 4)
              out += body + b"\0" * ((4 - len(body) % 4) % 4)

          new_rd = zstandard.ZstdCompressor(level=10).compress(out)
          hdr = bytearray(data[:1632])
          struct.pack_into("<I", hdr, 16, len(new_rd))
          img = (bytes(hdr) + b"\0" * (align(1632) - 1632)
                 + data[koff:koff + ksz] + b"\0" * (align(ksz) - ksz)
                 + new_rd + b"\0" * (align(len(new_rd)) - len(new_rd))
                 + tail)
          pathlib.Path("out").mkdir(exist_ok=True)
          pathlib.Path("out/boot-debug.img").write_bytes(img)
          print("boot-debug.img", len(img), hashlib.sha256(img).hexdigest())
          print("SEANDROIDENFORCE in tail:", b"SEANDROIDENFORCE" in tail)

          # --- verify what we just wrote -------------------------------
          u32b = lambda off: struct.unpack_from("<I", img, off)[0]
          assert img[:8] == b"ANDROID!" and u32b(36) == page
          assert u32b(8) == ksz and u32b(16) == len(new_rd)
          re_rd = img[roff:roff + len(new_rd)]
          re_rd = zstandard.ZstdDecompressor().stream_reader(io.BytesIO(re_rd)).read()
          pos, count, probe_seen = 0, 0, False
          while pos + 110 <= len(re_rd):
              h = re_rd[pos:pos+110]
              assert h[:6] == b"070701"
              g = [int(h[6+8*i:14+8*i], 16) for i in range(13)]
              nm = re_rd[pos+110:pos+110+g[11]-1].decode("utf-8", "replace")
              body = (pos + 110 + g[11] + 3) & ~3
              if nm == "init":
                  probe_seen = probe in re_rd[body:body+g[6]]
              pos = (body + g[6] + 3) & ~3
              count += 1
              if nm == "TRAILER!!!":
                  break
          print("verify: entries", count, "init-probe", probe_seen,
                "tail-bytes", len(tail), "cmdline-ok",
                img[64:576].split(b"\0")[0].decode() == data[64:576].split(b"\0")[0].decode())
          assert probe_seen and count == len(entries)
          PY

      - name: Upload boot-debug.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-debug-${{ github.run_id }}
          path: out/boot-debug.img
          retention-days: 7
