name: Build Nura for SM-C7000

# Builds a Nura (postmarketOS) image for the Samsung Galaxy C7 SM-C7000
# with pmbootstrap, entirely on GitHub's runners.
#
# Outputs (Actions artifact "nura-c7-<run>"):
#   boot.img                  Android boot image (kernel + initramfs + C7 DTB)
#   samsung-c7lte-root.img    ext4 rootfs, flashed to the USERDATA partition
#   samsung-c7lte.tar.md5     Odin package containing boot.img (optional path)
#   build.log                 pmbootstrap log, uploaded even when the build fails
#
# Nothing here signs anything: the C7 bootloader is unlocked and does not
# verify the boot image (verified boot is disabled on SM-C7000).

on:
  workflow_dispatch:
    inputs:
      pmaports_ref:
        description: "pmaports ref to build against"
        required: false
        default: "main"
  push:
    branches: [ main ]
    paths:
      - "pmaports/**"
      - "dts/**"
      - ".github/workflows/build.yml"
  schedule:
    # Weekly canary: catches upstream pmaports/kernel breakage early.
    - cron: "23 4 * * 6"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: pmbootstrap install (aarch64)
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      PMB_WORK: ${{ github.workspace }}/.pmb-work
      PMAPORTS: ${{ github.workspace }}/.pmb-work/cache_git/pmaports
      DEVICE: samsung-c7lte
      KPKG: linux-postmarketos-qcom-msm8953-c7

    steps:
      - uses: actions/checkout@v4

      # Reuse the kernel package and the source tarball between runs. The
      # kernel takes 40+ minutes to cross-build, so without this every
      # iteration on the image step costs a full kernel rebuild.
      - name: Restore build caches
        id: pmbcache
        uses: actions/cache/restore@v4
        with:
          # A unique key per run + a shared prefix: restore always picks the
          # most recent cache, and save never collides with an existing key.
          # (The plain actions/cache action skips its save when the job is
          # cancelled, which costs a full 60-70 min kernel rebuild every time.)
          path: .pmb-work/cache_ccache_aarch64
          key: pmb-pkgs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pmb-pkgs-

      - name: Restore kernel source tarball
        uses: actions/cache@v4
        with:
          path: .pmb-work/cache_distfiles
          key: pmb-distfiles-v7.1.3-r0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git python3 e2fsprogs xz-utils

      - name: Get pmbootstrap
        run: |
          git clone --depth=1 https://gitlab.nura.eco/nura/pmbootstrap.git
          sudo ln -sf "$PWD/pmbootstrap/pmbootstrap.py" /usr/local/bin/pmbootstrap
          pmbootstrap --version

      - name: Get pmaports and overlay this repo's packages
        env:
          PMAPORTS_REF: ${{ github.event.inputs.pmaports_ref || 'main' }}
        run: |
          mkdir -p "$(dirname "$PMAPORTS")"
          git clone --depth=1 --branch "$PMAPORTS_REF" \
            https://gitlab.nura.eco/nura/pmaports.git "$PMAPORTS"
          # Our device/kernel packages are copied over the pristine clone:
          # they live in this repo, not upstream. I never commit to the clone.
          cp -a pmaports/. "$PMAPORTS"/
          ls "$PMAPORTS/device/testing/" | grep -E 'c7lte|msm8953-c7'
          # pmbootstrap reads channels.cfg from the *upstream* remote of the
          # pmaports clone (it looks for the canonical gitlab.postmarketos.org
          # URL and then runs `git show <remote>/main:channels.cfg`).
          # Our clone's origin is the Nura mirror, so register the canonical
          # URL and point its remote-tracking ref at the same commit. No extra
          # network round-trip, and `pmbootstrap pull` still works if a human
          # runs it later.
          git -C "$PMAPORTS" remote add postmarketos \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git -C "$PMAPORTS" update-ref refs/remotes/postmarketos/main \
            "$(git -C "$PMAPORTS" rev-parse HEAD)"

      - name: Configure pmbootstrap
        run: |
          mkdir -p ~/.config
          cat > ~/.config/pmbootstrap_v3.cfg <<EOF
          [pmbootstrap]
          aports = $PMAPORTS
          work = $PMB_WORK
          device = $DEVICE
          kernel = postmarketos-qcom-msm8953-c7
          ui = console
          user = user
          hostname = c7lte
          locale = en_US.UTF-8
          timezone = Asia/Shanghai
          jobs = $(nproc)
          service_manager = openrc
          [providers]
          [mirrors]
          EOF
          cat ~/.config/pmbootstrap_v3.cfg

      - name: Initialize pmbootstrap
        run: |
          # pmbootstrap init clones pmaports (already cloned above), then
          # asks questions whose defaults are all preset in the config.
          # "yes ''" accepts every default.
          timeout 1200 bash -c 'yes "" | pmbootstrap --details-to-stdout init'
          pmbootstrap config device
          pmbootstrap config kernel
          # actions/cache restores the package and ccache directories with the
          # runner's uid. Inside the chroot the build runs as pmos, so abuild
          # cannot create the .apk and dies with "Permission denied" after a
          # full kernel build. Hand the cached trees back to pmos.
          pmbootstrap chroot -- chown -R pmos:pmos /mnt/pmbootstrap/cache_ccache_aarch64 || true

      - name: Prefetch the kernel source tarball
        run: |
          # codeload.github.com answers 429 Too Many Requests for anonymous
          # archive downloads from shared runner IPs. That broke `abuild
          # checksum` (and would break the build). Warm pmbootstrap's
          # distfiles cache with retries first, so abuild only has to verify
          # the checksum of a file that is already on disk.
          pmbootstrap chroot -- true
          DIST="$PMB_WORK/cache_distfiles"
          NAME="$KPKG-v7.1.3-r0.tar.gz"
          TMP="$RUNNER_TEMP/$NAME"
          # pmbootstrap owns $PMB_WORK/cache_distfiles as root, so download
          # somewhere writable and install the file with sudo afterwards.
          for i in $(seq 1 12); do
            if curl -fL --retry 2 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 20 -o "$TMP" \
                 "https://codeload.github.com/msm8953-mainline/linux/tar.gz/refs/tags/v7.1.3-r0"; then
              echo "downloaded $TMP ($(stat -c%s "$TMP") bytes)"
              break
            fi
            echo "download attempt $i failed, backing off"
            sleep $(( i * 8 ))
          done
          test -s "$TMP"
          sudo mkdir -p "$DIST"
          sudo install -m 644 "$TMP" "$DIST/$NAME"
          ls -l "$DIST/$NAME"
          sha512sum "$DIST/$NAME"

      - name: Recompute checksums
        run: |
          # Keeps the APKBUILDs valid when dts/, config or files change.
          # Done here with hashlib instead of `pmbootstrap checksum`: abuild
          # rewrites the block itself and got confused by the "name::url"
          # form, rewriting a source line with a hash. This is deterministic,
          # prints what it produced, and keeps the hash of remote sources.
          python3 - "$PMAPORTS" "$KPKG" "device-$DEVICE" <<'PY'
          import hashlib, pathlib, re, sys

          root = pathlib.Path(sys.argv[1])
          for pkg in sys.argv[2:]:
              d = root / "device" / "testing" / pkg
              apk = d / "APKBUILD"
              text = apk.read_text()

              old = {}
              m = re.search(r'sha512sums="([\s\S]*?)"\n', text)
              if m:
                  for line in m.group(1).splitlines():
                      parts = line.split()
                      if len(parts) == 2:
                          old[parts[1]] = parts[0]

              m = re.search(r'source="([\s\S]*?)"\n', text)
              if not m:
                  print(f"== {pkg}: no sources, skipped")
                  continue
              variables = dict(re.findall(r"^(_?[a-z_]+)=[\"']?([^\"'\n]+)[\"']?$", text, re.M))

              lines = []
              for item in m.group(1).split():
                  name = item.split("::", 1)[0] if "::" in item else item.rsplit("/", 1)[-1]
                  for _ in range(3):
                      for key in sorted(variables, key=len, reverse=True):
                          name = name.replace("${" + key + "}", variables[key])
                          name = name.replace("$" + key, variables[key])
                  path = d / name
                  if path.is_file():
                      h = hashlib.sha512(path.read_bytes()).hexdigest()
                  elif name in old:
                      h = old[name]          # remote source, fetched by abuild
                      print(f"   keeping hash of remote source {name}")
                  else:
                      sys.exit(f"no way to hash {path}")
                  lines.append(f"{h}  {name}")
              block = 'sha512sums="\n' + "\n".join(lines) + '\n"\n'
              apk.write_text(re.sub(r'sha512sums="[\s\S]*?"\n', block, text, count=1))
              print(f"== {pkg}")
              for line in lines:
                  print("   " + line)
          PY

      - name: Build the C7 kernel and device packages
        run: |
          # Build both explicitly: "pmbootstrap install" only builds what its
          # dependency walk finds missing, and a restored package cache can
          # leave it with a stale index entry but no .apk on disk.
          pmbootstrap --details-to-stdout build "$KPKG" "device-$DEVICE"
          # Make sure both binary packages really exist before installing.
          ls -l "$PMB_WORK/packages/edge/aarch64/$KPKG"-*.apk
          ls -l "$PMB_WORK/packages/edge/aarch64/device-$DEVICE"-*.apk

      - name: Build the image
        run: |
          # --split: bare ext4 rootfs image + separate /boot image, which is
          # what a non-A/B device with a 32 GB eMMC wants.
          images="$PMB_WORK/chroot_native/home/pmos/rootfs"
          rc=1
          for attempt in 1 2; do
            # Capture the exit status of the command itself. Reading $? after
            # an "if cmd; then" compound yields the status of the "if", which
            # is 0 when the branch is not taken -- that bug made a failed
            # install look successful and hid the real mkinitfs error.
            set +e
            pmbootstrap -y --details-to-stdout install --split --password 147147
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              break
            fi
            echo "::warning::install attempt $attempt exited $rc"
            # Known runner flake: teardown fails on "umount: .../usr/bin/
            # qemu-aarch64-static: target is busy" although the image has
            # already been written. Detach it and retry once.
            sudo umount -l "$PMB_WORK/chroot_rootfs_$DEVICE/usr/bin/qemu-aarch64-static" || true
            pmbootstrap shutdown || true
            sleep 5
          done

          ls -l "$images" || true
          # The images are the contract, not the exit code.
          if [ ! -s "$images/$DEVICE-root.img" ] || [ ! -s "$images/$DEVICE-boot.img" ]; then
            echo "::error::pmbootstrap install produced no image (last exit $rc)"
            exit 1
          fi

      - name: Export flashable artifacts
        if: success()
        run: |
          mkdir -p out
          pmbootstrap export --odin || pmbootstrap export
          ls -l /tmp/postmarketOS-export || true

          cp -v /tmp/postmarketOS-export/boot.img "out/boot.img"
          cp -v "/tmp/postmarketOS-export/$DEVICE-root.img" \
                "out/$DEVICE-root.img"
          # Odin tar is built by "export --odin"; it is a convenience path
          # (Heimdall is the primary one), so a miss is not fatal.
          cp -v "/tmp/postmarketOS-export/$DEVICE.tar.md5" out/ || true
          cp -rv /tmp/postmarketOS-export/dtbs out/dtbs || true

          find out -maxdepth 1 -type f -exec sha256sum {} + > out/SHA256SUMS || true

      - name: Save build caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .pmb-work/cache_ccache_aarch64
          key: pmb-pkgs-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect log
        if: always()
        run: |
          mkdir -p out
          test -f "$PMB_WORK/log.txt" && cp "$PMB_WORK/log.txt" out/build.log || true
          tail -n 100 out/build.log 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nura-c7-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: warn
