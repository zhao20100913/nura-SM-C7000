# The WCN3680 in this phone is driven by wcn36xx, and with 802.11 power save
# enabled the 4-way handshake routinely dies: the AP's EAPOL frames are
# buffered in firmware power-save queues and never reach mac80211 in time.
# Scans work fine, which makes it look like a password problem.  Turn PS off.
# (Same fix as pmaports/device/testing/device-samsung-c7lte/10-wcn36xx.conf.)
[connection]
wifi.powersave = 2
